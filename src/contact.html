<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{contact_title}} · {{title}}</title>
<meta name="description" content="{{contact_description}}">
<link rel="canonical" href="https://firstlawenergies.com{{contact_path}}">
<link rel="alternate" hreflang="{{lang}}" href="https://firstlawenergies.com{{contact_path}}">
<link rel="alternate" hreflang="{{alt_lang}}" href="https://firstlawenergies.com{{contact_alt_path}}">
<link rel="alternate" hreflang="x-default" href="https://firstlawenergies.com/contato/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/scrollcraft.css">
<link rel="stylesheet" href="/assets/site.css">
<meta name="theme-color" content="#050912">
</head>
<body class="page">

<div class="sc-grain" aria-hidden="true"></div>

<header class="bar" id="bar">
  <a class="mark" href="{{path}}" aria-label="First Law Energies">
    <span class="mark__eq">ΔU = 0</span>
    <span class="mark__name">First Law Energies</span>
  </a>
  <nav class="bar__nav" aria-label="{{nav_aria}}">
    <a href="{{path}}#solucoes">{{nav_solutions}}</a>
    <a href="{{path}}#{{how_id}}">{{nav_how}}</a>
    <a href="{{contact_path}}">{{nav_contact}}</a>
  </nav>
  <div class="bar__end">
    <a class="lang" href="{{contact_alt_path}}" hreflang="{{alt_lang}}" lang="{{alt_lang}}"><span class="lang__self">{{self_label}}</span><span class="lang__sep">·</span><span class="lang__alt">{{alt_label}}</span></a>
    <a class="cta cta--bar" href="{{login_url}}" rel="noopener">{{login}}</a>
  </div>
</header>

<main id="top">
  <section class="contact" aria-labelledby="contact-h1">
    <div class="contact__inner">
      <h1 class="contact__h1" id="contact-h1">{{contact_title}}</h1>
      <p class="contact__lede">{{contact_lede}}</p>

      <!-- FormSubmit: static hosting, the mail goes to contact.form_action_email in the copy file.
           The first submission triggers FormSubmit's one-time activation mail to that address. -->
      <form class="form" action="https://formsubmit.co/{{contact_form_action_email}}" method="POST" accept-charset="utf-8">
        <input type="hidden" name="_subject" value="{{contact_subject}}">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_next" value="{{contact_next}}">
        <input class="form__hp" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">

        <div class="field">
          <label class="field__label" for="f-first">{{contact_first}}<span class="field__req" aria-hidden="true">*</span></label>
          <input class="field__input" id="f-first" name="name" type="text" autocomplete="given-name" required>
        </div>
        <div class="field">
          <label class="field__label" for="f-last">{{contact_last}}<span class="field__req" aria-hidden="true">*</span></label>
          <input class="field__input" id="f-last" name="last_name" type="text" autocomplete="family-name" required>
        </div>
        <div class="field field--full">
          <label class="field__label" for="f-email">{{contact_email}}<span class="field__req" aria-hidden="true">*</span></label>
          <input class="field__input" id="f-email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label class="field__label" for="f-company">{{contact_company}}<span class="field__req" aria-hidden="true">*</span></label>
          <input class="field__input" id="f-company" name="company" type="text" autocomplete="organization" required>
        </div>
        <div class="field field--select">
          <label class="field__label" for="f-segment">{{contact_segment}}<span class="field__req" aria-hidden="true">*</span></label>
          <select class="field__input" id="f-segment" name="segment" required>
            <option value="" selected disabled>{{contact_select}}</option>
            <option value="{{contact_seg_gen}}">{{contact_seg_gen}}</option>
            <option value="{{contact_seg_td}}">{{contact_seg_td}}</option>
            <option value="{{contact_seg_dc}}">{{contact_seg_dc}}</option>
          </select>
        </div>
        <div class="field field--full">
          <label class="field__label" for="f-message">{{contact_message}}</label>
          <textarea class="field__input" id="f-message" name="message" rows="5"></textarea>
        </div>
        <div class="form__end">
          <button class="cta" type="submit">{{contact_submit}}</button>
        </div>
      </form>
    </div>
  </section>

  <footer class="foot foot--page">
    <div class="foot__inner">
      <p class="foot__eq">{{foot_eq}}</p>
      <p class="sc-label foot__copy">{{foot_copy}}</p>
    </div>
  </footer>
</main>

<script>(function(){var b=document.getElementById("bar");function f(){b.classList.toggle("is-scrolled",scrollY>24);}addEventListener("scroll",f,{passive:true});f();})();</script>
</body>
</html>
