<!doctype html>
<html lang="{{lang}}">
<head>
{{> head}}
<title>{{redirect_titulo}} · {{title}}</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url={{redirect_to}}">
<link rel="canonical" href="https://firstlawenergies.com/">
<style>
.aviso { padding: var(--sc-9) var(--sc-gutter); display: flex; flex-direction: column; align-items: flex-start; gap: 1.25rem; max-width: 40rem; }
.aviso h1 { margin: 0; font-family: var(--sc-font-display); font-weight: 600; font-size: clamp(2rem, 1.63rem + 1.524vw, 3rem); letter-spacing: var(--sc-track-snug); line-height: 1.06; }
.aviso p { margin: 0; font-size: var(--sc-t-base); color: var(--sc-ink-soft); }
</style>
</head>
<body>

{{> bar}}

<main class="aviso" id="top">
  <h1>{{redirect_titulo}}</h1>
  <p>{{redirect_texto}}</p>
  <a class="btn" href="{{redirect_to}}">{{redirect_link}}</a>
</main>

</body>
</html>
