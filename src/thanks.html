<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{contact_thanks_title}} · {{title}}</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://firstlawenergies.com{{contact_thanks_path}}">
<link rel="alternate" hreflang="{{lang}}" href="https://firstlawenergies.com{{contact_thanks_path}}">
<link rel="alternate" hreflang="{{alt_lang}}" href="https://firstlawenergies.com{{contact_thanks_alt_path}}">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/scrollcraft.css">
<link rel="stylesheet" href="/assets/site.css">
<meta name="theme-color" content="#050912">
</head>
<body class="page">

<div class="sc-grain" aria-hidden="true"></div>

<header class="bar" id="bar">
  <a class="mark" href="{{path}}" aria-label="First Law Energies">
    {{mark_svg}}
    <span class="mark__name">First Law Energies</span>
  </a>
  <nav class="bar__nav" aria-label="{{nav_aria}}">
    <a href="{{path}}#solucoes">{{nav_solutions}}</a>
    <a href="{{path}}#{{how_id}}">{{nav_how}}</a>
    <a href="{{contact_path}}">{{nav_contact}}</a>
  </nav>
  <div class="bar__end">
    <a class="lang" href="{{contact_thanks_alt_path}}" hreflang="{{alt_lang}}" lang="{{alt_lang}}"><span class="lang__self">{{self_label}}</span><span class="lang__sep">·</span><span class="lang__alt">{{alt_label}}</span></a>
    <a class="cta cta--bar" href="{{login_url}}" rel="noopener">{{login}}</a>
  </div>
</header>

<main id="top">
  <section class="contact contact--thanks" aria-labelledby="thanks-h1">
    <div class="contact__inner">
      <h1 class="contact__h1" id="thanks-h1">{{contact_thanks_title}}</h1>
      <p class="contact__lede">{{contact_thanks_body}}</p>
      <a class="contact__back" href="{{path}}">{{contact_thanks_back}}</a>
    </div>
  </section>

  <footer class="foot foot--page">
    <div class="foot__inner">
      <p class="foot__eq-wrap">{{foot_eq_svg}}</p>
      <p class="sc-label foot__copy">{{foot_copy}}</p>
    </div>
  </footer>
</main>

<script>(function(){var b=document.getElementById("bar");function f(){b.classList.toggle("is-scrolled",scrollY>24);}addEventListener("scroll",f,{passive:true});f();})();</script>
</body>
</html>
