<section class="diag" id="{{home_ids_diag}}" aria-labelledby="diag-h2">
  <div class="diag__head"><p class="diag__n">{{home_diag_n}}</p><h2 id="diag-h2">{{home_diag_h2}}</h2><p>{{home_diag_p}}</p></div>
  <form class="diag__form" id="form-diagnostico" novalidate>
    <div class="diag__campo"><label class="campo__rotulo" for="f-empresa">{{home_diag_form_empresa}}</label><input class="diag__input" id="f-empresa" name="empresa" type="text" autocomplete="organization" placeholder="{{home_diag_form_empresa_ph}}" required></div>
    <div class="diag__campo"><label class="campo__rotulo" for="f-contato">{{home_diag_form_contato}}</label><input class="diag__input" id="f-contato" name="contato" type="text" autocomplete="tel" inputmode="email" placeholder="{{home_diag_form_contato_ph}}" required></div>
    <div class="diag__campo diag__campo--file"><label class="campo__rotulo" for="f-faturas">{{home_diag_form_faturas}}</label>
      <label class="diag__file" for="f-faturas"><span class="diag__file-text" id="f-faturas-label">{{home_diag_form_faturas_ph}}</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"></path><path d="M6 10l6-6 6 6"></path><path d="M4 20h16"></path></svg></label>
      <input id="f-faturas" name="faturas" type="file" accept="application/pdf,.pdf" multiple class="sr-only"></div>
    <button class="btn btn--solid diag__enviar" id="f-enviar" type="submit">{{home_diag_form_enviar}}</button>
    <input class="diag__site" id="f-site" name="site" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
    <p class="diag__erro" id="f-erro" role="alert" hidden></p>
  </form>
  <div class="diag__sucesso" id="f-sucesso" hidden><p class="diag__sucesso-h" tabindex="-1">{{home_diag_form_sucesso_h}}</p><p class="diag__sucesso-p">{{diag_sucesso_p_html}}</p></div>
  <p class="diag__priv">{{home_diag_form_privacidade}}</p>
</section>
