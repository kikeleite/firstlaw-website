<span class="ancora-antiga" id="diagnostico" aria-hidden="true"></span>
<section class="diag" data-contato id="{{home_ids_contato}}" aria-labelledby="diag-h2">
  <div class="diag__head"><h2 id="diag-h2">{{home_contato_h2}}</h2><p>{{home_contato_p}}</p></div>
  <form class="diag__form" id="form-contato" novalidate>
    <div class="diag__campo"><label class="campo__rotulo" for="f-empresa">{{home_contato_form_empresa}}</label><input class="diag__input" id="f-empresa" name="empresa" type="text" autocomplete="organization" placeholder="{{home_contato_form_empresa_ph}}" required></div>
    <div class="diag__campo"><label class="campo__rotulo" for="f-contato">{{home_contato_form_contato}}</label><input class="diag__input" id="f-contato" name="contato" type="text" autocomplete="on" placeholder="{{home_contato_form_contato_ph}}" required></div>
    <button class="btn btn--solid diag__enviar" id="f-enviar" type="submit">{{home_contato_form_enviar}}</button>
    <input class="diag__site" id="f-site" name="site" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
    <p class="diag__erro" id="f-erro" role="alert" hidden></p>
  </form>
  <div class="diag__sucesso" id="f-sucesso" hidden><p class="diag__sucesso-h" tabindex="-1">{{home_contato_form_sucesso_h}}</p><p class="diag__sucesso-p">{{contato_sucesso_p_html}}</p></div>
</section>
