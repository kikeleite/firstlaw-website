<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fale com a First Law Energies · First Law Energies</title>
<meta name="description" content="Fale com a First Law Energies sobre geração, transmissão e distribuição ou data centers.">
<link rel="canonical" href="https://firstlawenergies.com/contato/">
<link rel="alternate" hreflang="pt-BR" href="https://firstlawenergies.com/contato/">
<link rel="alternate" hreflang="en" href="https://firstlawenergies.com/en/contact/">
<link rel="alternate" hreflang="x-default" href="https://firstlawenergies.com/contato/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/scrollcraft.css">
<link rel="stylesheet" href="/assets/site.css">
<meta name="theme-color" content="#050912">
</head>
<body class="page">

<div class="sc-grain" aria-hidden="true"></div>

<header class="bar" id="bar">
  <a class="mark" href="/" aria-label="First Law Energies">
    <span class="mark__eq">ΔU = 0</span>
    <span class="mark__name">First Law Energies</span>
  </a>
  <nav class="bar__nav" aria-label="Principal">
    <a href="/#solucoes">Soluções</a>
    <a href="/#como-funciona">Como funciona</a>
    <a href="/contato/">Contato</a>
  </nav>
  <div class="bar__end">
    <a class="lang" href="/en/contact/" hreflang="en" lang="en"><span class="lang__self">PT</span><span class="lang__sep">·</span><span class="lang__alt">EN</span></a>
    <a class="cta cta--bar" href="https://first-law-energies-prototype-fronte.vercel.app/auth" rel="noopener">Login</a>
  </div>
</header>

<main id="top">
  <section class="contact" aria-labelledby="contact-h1">
    <div class="contact__inner">
      <h1 class="contact__h1" id="contact-h1">Fale com a First Law Energies</h1>
      <p class="contact__lede">Diga o que você precisa e respondemos no endereço informado.</p>

      <!-- FormSubmit: static hosting, the mail goes to contact.form_action_email in the copy file.
           The first submission triggers FormSubmit's one-time activation mail to that address. -->
      <form class="form" action="https://formsubmit.co/henrique@firstlawenergies.com" method="POST" accept-charset="utf-8">
        <input type="hidden" name="_subject" value="Contato pelo site">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_next" value="https://firstlawenergies.com/contato/obrigado/">
        <input class="form__hp" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">

        <div class="field">
          <label class="field__label" for="f-first">Nome<span class="field__req" aria-hidden="true">*</span></label>
          <input class="field__input" id="f-first" name="name" type="text" autocomplete="given-name" required>
        </div>
        <div class="field">
          <label class="field__label" for="f-last">Sobrenome<span class="field__req" aria-hidden="true">*</span></label>
          <input class="field__input" id="f-last" name="last_name" type="text" autocomplete="family-name" required>
        </div>
        <div class="field field--full">
          <label class="field__label" for="f-email">E-mail profissional<span class="field__req" aria-hidden="true">*</span></label>
          <input class="field__input" id="f-email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label class="field__label" for="f-company">Empresa<span class="field__req" aria-hidden="true">*</span></label>
          <input class="field__input" id="f-company" name="company" type="text" autocomplete="organization" required>
        </div>
        <div class="field field--select">
          <label class="field__label" for="f-segment">Segmento<span class="field__req" aria-hidden="true">*</span></label>
          <select class="field__input" id="f-segment" name="segment" required>
            <option value="" selected disabled>Selecione</option>
            <option value="Geradora">Geradora</option>
            <option value="Transmissão &amp; Distribuição">Transmissão &amp; Distribuição</option>
            <option value="Data center">Data center</option>
          </select>
        </div>
        <div class="field field--full">
          <label class="field__label" for="f-message">Mensagem</label>
          <textarea class="field__input" id="f-message" name="message" rows="5"></textarea>
        </div>
        <div class="form__end">
          <button class="cta" type="submit">Enviar →</button>
        </div>
      </form>
    </div>
  </section>

  <footer class="foot foot--page">
    <div class="foot__inner">
      <p class="foot__eq">ΔU = 0</p>
      <p class="sc-label foot__copy">© 2026 First Law Energies</p>
    </div>
  </footer>
</main>

<script>(function(){var b=document.getElementById("bar");function f(){b.classList.toggle("is-scrolled",scrollY>24);}addEventListener("scroll",f,{passive:true});f();})();</script>
</body>
</html>
