<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talk to First Law Energies · First Law Energies</title>
<meta name="description" content="Talk to First Law Energies about generation, transmission and distribution or data centers.">
<link rel="canonical" href="https://firstlawenergies.com/en/contact/">
<link rel="alternate" hreflang="en" href="https://firstlawenergies.com/en/contact/">
<link rel="alternate" hreflang="pt-BR" href="https://firstlawenergies.com/contato/">
<link rel="alternate" hreflang="x-default" href="https://firstlawenergies.com/contato/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/scrollcraft.css">
<link rel="stylesheet" href="/assets/site.css">
<meta name="theme-color" content="#050912">
</head>
<body class="page">

<div class="sc-grain" aria-hidden="true"></div>

<header class="bar" id="bar">
  <a class="mark" href="/en/" aria-label="First Law Energies">
    <span class="mark__eq">ΔU = 0</span>
    <span class="mark__name">First Law Energies</span>
  </a>
  <nav class="bar__nav" aria-label="Main">
    <a href="/en/#solucoes">Solutions</a>
    <a href="/en/#how-it-works">How it works</a>
    <a href="/en/contact/">Contact</a>
  </nav>
  <div class="bar__end">
    <a class="lang" href="/contato/" hreflang="pt-BR" lang="pt-BR"><span class="lang__self">EN</span><span class="lang__sep">·</span><span class="lang__alt">PT</span></a>
    <a class="cta cta--bar" href="https://first-law-energies-prototype-fronte.vercel.app/auth" rel="noopener">Login</a>
  </div>
</header>

<main id="top">
  <section class="contact" aria-labelledby="contact-h1">
    <div class="contact__inner">
      <h1 class="contact__h1" id="contact-h1">Talk to First Law Energies</h1>
      <p class="contact__lede">Tell us what you need and we reply to the email you leave here.</p>

      <!-- FormSubmit: static hosting, the mail goes to contact.form_action_email in the copy file.
           The first submission triggers FormSubmit's one-time activation mail to that address. -->
      <form class="form" action="https://formsubmit.co/contato@firstlawenergies.com" method="POST" accept-charset="utf-8">
        <input type="hidden" name="_subject" value="Contact from the website">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_next" value="https://firstlawenergies.com/en/contact/thanks/">
        <input class="form__hp" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">

        <div class="field">
          <label class="field__label" for="f-first">First name</label>
          <input class="field__input" id="f-first" name="name" type="text" autocomplete="given-name" required>
        </div>
        <div class="field">
          <label class="field__label" for="f-last">Last name</label>
          <input class="field__input" id="f-last" name="last_name" type="text" autocomplete="family-name" required>
        </div>
        <div class="field field--full">
          <label class="field__label" for="f-email">Work email</label>
          <input class="field__input" id="f-email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label class="field__label" for="f-company">Company</label>
          <input class="field__input" id="f-company" name="company" type="text" autocomplete="organization" required>
        </div>
        <div class="field field--select">
          <label class="field__label" for="f-segment">Segment</label>
          <select class="field__input" id="f-segment" name="segment" required>
            <option value="" selected disabled>Select</option>
            <option value="Generator">Generator</option>
            <option value="Transmission &amp; Distribution">Transmission &amp; Distribution</option>
            <option value="Data center">Data center</option>
          </select>
        </div>
        <div class="field field--full">
          <label class="field__label" for="f-message">Message</label>
          <textarea class="field__input" id="f-message" name="message" rows="5"></textarea>
        </div>
        <div class="form__end">
          <button class="cta" type="submit">Send →</button>
        </div>
      </form>
    </div>
  </section>

  <footer class="foot foot--page">
    <div class="foot__inner">
      <p class="foot__eq">ΔU = 0</p>
      <p class="sc-label foot__copy">© 2026 First Law Energies</p>
    </div>
  </footer>
</main>

<script>(function(){var b=document.getElementById("bar");function f(){b.classList.toggle("is-scrolled",scrollY>24);}addEventListener("scroll",f,{passive:true});f();})();</script>
</body>
</html>
